<!DOCTYPE html>
<html>
<head>
    <title>Movie Results</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body>
    <header>
         <h1>Top recommendations</h1>
    </header>
   

    <ol>
    {% for movie in movies %}
        <li>
            <h2>
                <strong>{{ movie.title }}</strong><br>
            </h2>
            
            {{ movie.description }}<br>
            <div class="break"></div>
            <br>
            <!-- Score: {{ movie.score }} -->
        </li>
    {% endfor %}
    </ol>

    <a href="/">Go back</a>
</body>
</html>
